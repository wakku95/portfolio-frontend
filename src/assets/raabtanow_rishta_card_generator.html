<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RaabtaNow — Rishta Card Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f8; color: #171923;
  }
  .app { max-width: 1180px; margin: 0 auto; padding: 28px; }
  header {
    display:flex; align-items:center; gap:18px; margin-bottom:24px;
    background:#0d101b; border-radius:18px; padding:16px 20px;
    box-shadow:0 8px 30px rgba(0,0,0,.10);
  }
  header img { width:252px; height:63px; object-fit:contain; }
  header .hint { margin-left:auto; color:#b9bdcc; font-size:13px; }
  .grid { display:grid; grid-template-columns:390px 1fr; gap:28px; align-items:start; }
  .panel {
    background:white; border-radius:18px; padding:22px;
    box-shadow:0 8px 30px rgba(25,28,45,.08);
  }
  h2 { margin:0 0 18px; font-size:21px; }
  .field { margin-bottom:13px; }
  label { display:block; font-size:12px; font-weight:700; color:#626878; margin-bottom:6px; }
  input, select {
    width:100%; padding:11px 12px; border:1px solid #dfe2ea; border-radius:10px;
    font-size:14px; outline:none; background:#fff;
  }
  input:focus, select:focus { border-color:#bd2e86; box-shadow:0 0 0 3px rgba(189,46,134,.10); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button {
    border:0; border-radius:11px; padding:12px 16px; font-weight:700;
    cursor:pointer; font-size:14px;
  }
  .download { width:100%; color:white; background:#b92883; margin-top:8px; }
  .download:hover { background:#9f1f71; }
  .reset { width:100%; margin-top:9px; background:#eef0f5; color:#383c48; }
  .preview-title { font-size:13px; color:#737887; margin:0 0 10px; }
  .canvas-wrap {
    display:flex; justify-content:center; align-items:center;
    background:#e7e8ee; border-radius:16px; padding:18px; overflow:auto;
  }
  canvas { width:min(100%, 720px); height:auto; display:block; box-shadow:0 10px 35px rgba(0,0,0,.16); }
  .small { font-size:11px; color:#818694; line-height:1.5; margin-top:12px; }
  @media(max-width:850px) {
    .grid { grid-template-columns:1fr; }
    header .hint { display:none; }
    .app { padding:14px; }
  }
</style>
</head>

logo.onload = draw;

const fields = ["code","age","gender","city","faith","education","profession","height","status","managed"];
fields.forEach(id => document.getElementById(id).addEventListener("input", draw));
fields.forEach(id => document.getElementById(id).addEventListener("change", draw));

function value(id) {
  return document.getElementById(id).value.trim();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function fitText(ctx, text, maxWidth, startSize, weight="600") {
  let size = startSize;
  while (size > 22) {
    ctx.font = `${weight} ${size}px Arial`;
    if (ctx.measureText(text).width <= maxWidth) return size;
    size -= 1;
  }
  return size;
}

function draw() {
  const c = document.getElementById("card"), ctx = c.getContext("2d");
  const W = c.width, H = c.height;

  // Background
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0, "#0d101b");
  bg.addColorStop(0.47, "#171326");
  bg.addColorStop(1, "#3a1740");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // Decorative circles
  ctx.globalAlpha = .16;
  ctx.fillStyle = "#e44ba5";
  ctx.beginPath(); ctx.arc(1010,80,250,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = "#7d5cff";
  ctx.beginPath(); ctx.arc(60,1020,230,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // Main white card
  ctx.fillStyle = "#ffffff";
  roundRect(ctx, 70, 65, 940, 950, 34); ctx.fill();

  // Header area
  ctx.fillStyle = "#0d101b";
  roundRect(ctx, 70, 65, 940, 190, 34); ctx.fill();
  ctx.fillRect(70, 220, 940, 35);

  // Logo
  ctx.drawImage(logo, 105, 98, 252, 63);

  // "Candidate Profile"
  ctx.fillStyle = "#f1f2f7";
  ctx.font = "700 27px Arial";
  ctx.fillText("CANDIDATE PROFILE", 105, 203);

  // Profile code pill
  const code = "#" + value("code");
  ctx.fillStyle = "#b92883";
  roundRect(ctx, 735, 111, 220, 62, 31); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.font = "700 25px Arial";
  ctx.textAlign = "center";
  ctx.fillText(code, 845, 150);
  ctx.textAlign = "left";

  // Age / gender
  const identity = `${value("age")} yrs • ${value("gender")}`;
  ctx.fillStyle = "#242736";
  ctx.font = "700 48px Arial";
  ctx.fillText(identity, 105, 330);

  // City
  ctx.fillStyle = "#b92883";
  ctx.font = "700 27px Arial";
  ctx.fillText("LOCATION", 105, 385);
  ctx.fillStyle = "#292c38";
  ctx.font = "600 32px Arial";
  ctx.fillText(value("city"), 105, 428);

  // Divider
  ctx.strokeStyle = "#e8e9ef"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(105,455); ctx.lineTo(975,455); ctx.stroke();

  const rows = [
    ["FAITH & SECT", value("faith")],
    ["EDUCATION", value("education")],
    ["PROFESSION", value("profession")],
    ["HEIGHT", value("height")],
    ["MARITAL STATUS", value("status")],
    ["MANAGED BY", value("managed")]
  ];

  let y = 505;
  rows.forEach(([label, val], i) => {
    ctx.fillStyle = "#737887";
    ctx.font = "700 20px Arial";
    ctx.fillText(label, 105, y);

    const fs = fitText(ctx, val, 560, 28, "600");
    ctx.fillStyle = "#252835";
    ctx.font = `600 ${fs}px Arial`;
    ctx.fillText(val, 395, y);

    if (i < rows.length-1) {
      ctx.strokeStyle = "#eeeeF2"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(105, y+25); ctx.lineTo(975, y+25); ctx.stroke();
    }
    y += 72;
  });

  // Footer
  ctx.fillStyle = "#f7f2f7";
  roundRect(ctx, 105, 905, 870, 78, 18); ctx.fill();
  ctx.fillStyle = "#b92883";
  ctx.font = "700 23px Arial";
  ctx.fillText("Interested in this profile?", 130, 940);
  ctx.fillStyle = "#383b47";
  ctx.font = "600 21px Arial";
  ctx.fillText("Visit RaabtaNow.com", 130, 967);

  ctx.textAlign = "right";
  ctx.fillStyle = "#737887";
  ctx.font = "500 17px Arial";
  ctx.fillText("Privacy-first matrimonial platform", 950, 950);
  ctx.textAlign = "left";
}

function downloadCard() {
  const canvas = document.getElementById("card");
  const link = document.createElement("a");
  link.download = "raabtanow-profile-" + (value("code") || "card") + ".png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

function resetForm() {
  document.getElementById("code").value = "RK-TDPAQ9";
  document.getElementById("age").value = "19";
  document.getElementById("gender").value = "Female";
  document.getElementById("city").value = "Karachi";
  document.getElementById("faith").value = "Islam • Sunni";
  document.getElementById("education").value = "Intermediate / A-Level";
  document.getElementById("profession").value = "Other";
  document.getElementById("height").value = '5\'9" (175 cm)';
  document.getElementById("status").value = "Never Married";
  document.getElementById("managed").value = "Brother / Sister";
  draw();
}
</script>
